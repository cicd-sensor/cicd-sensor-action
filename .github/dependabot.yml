version: 2
updates:
  # npm dependencies for the JavaScript action source and bundled dist build.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # GitHub Actions used by this repository's CI and smoke workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
