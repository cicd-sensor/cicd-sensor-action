---
name: smoke

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Start cicd-sensor
        id: sensor
        uses: ./
        with:
          enable-html-report: "true"
          enable-debug: "true"

      - name: Workload
        run: |
          set -euo pipefail

          echo "::group::testevent triggers (cicd-sensor/testevent ruleset)"
          # testevent_domain_lookup: resolve the canary domain so the agent
          # sees a `domain` event for testevent.cicd-sensor.com.
          getent hosts testevent.cicd-sensor.com || true
          dig +short testevent.cicd-sensor.com || true
          # testevent_file_write: write to a path ending in
          # /cicd-sensor-testevent.txt so the agent sees a write `file_open` event.
          canary="${RUNNER_TEMP:-/tmp}/cicd-sensor-testevent.txt"
          echo "cicd-sensor canary" > "$canary"
          ls -la "$canary"
          rm -f "$canary"
          echo "::endgroup::"

          echo "::group::process and system info"
          uname -a
          id
          ps -eo pid,comm | head -20
          echo "::endgroup::"

          echo "::group::filesystem activity"
          tmpfile="$(mktemp)"
          echo "smoke-test payload" > "$tmpfile"
          cat "$tmpfile"
          ls -la "$tmpfile"
          rm -f "$tmpfile"
          echo "::endgroup::"

          echo "::group::DNS resolution"
          getent hosts api.github.com || true
          dig +short github.com || true
          echo "::endgroup::"

          echo "::group::HTTP/HTTPS"
          curl --silent --show-error --max-time 5 https://api.github.com/zen || true
          echo
          curl --silent --show-error --max-time 5 -o /dev/null -w "status=%{http_code}\n" https://example.com
          wget --quiet --timeout=5 --tries=1 -O /dev/null https://example.com && echo "wget ok" || true
          echo "::endgroup::"

          echo "::group::raw TCP via nc"
          nc -zv -w 5 github.com 443 || true
          echo "::endgroup::"

          echo "::group::toolchain versions"
          node --version
          npm --version
          echo "::endgroup::"

          echo "smoke workload completed"

      - name: Echo attestation outputs
        if: always()
        run: |
          echo "attestation-artifact-id=${{ steps.sensor.outputs.attestation-artifact-id }}"
          echo "attestation-artifact-url=${{ steps.sensor.outputs.attestation-artifact-url }}"
