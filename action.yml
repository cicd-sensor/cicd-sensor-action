---
name: "cicd-sensor"
description: >-
  eBPF-powered CI/CD runtime security sensor for GitHub Actions
  — detect attacks and suspicious activity at runtime.

branding:
  icon: shield
  color: green

# ---------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------
inputs:
  cicd-sensor-version:
    description: >-
      cicd-sensor agent version this action installs. Bumped
      automatically by Renovate when a new cicd-sensor/cicd-sensor
      releases/v* tag is published. Override only to pin to a
      different release (for example, to test a pre-release).
    required: false
    default: "v0.0.49"

  github-token:
    description: >-
      Token used to fetch `.cicd-sensor/config.yaml` and
      `.cicd-sensor/rules/` from the calling repo via the GitHub
      Contents API. Defaults to the workflow's automatic GITHUB_TOKEN;
      only set this if your workflow strips the default.
    required: false
    default: ${{ github.token }}

  socket-path:
    description: >-
      Path to the agent control socket. Override for self-hosted
      runners that already run cicd-sensor under a non-default
      socket; when the path already points to a live socket, the
      action skips download / install and reuses the existing agent.
    required: false
    default: "/run/cicd-sensor/agent.sock"

  manager-url:
    description: >-
      Optional manager URL for config. When set, authenticate with
      manager-token or manager-auth: oidc, and project-local `.cicd-sensor/`
      config is ignored (config is fetched from the manager).
    required: false
    default: ""

  manager-auth:
    description: >-
      Manager authentication: manager-token (default) or oidc. OIDC requires
      manager-url, permissions: id-token: write, and Agent/CLI v0.0.49 or newer;
      cannot be combined with manager-token. The Manager must enable OIDC
      and allow the calling repository. Reused Agents must also be upgraded
      and restarted by the host operator.
    required: false
    default: "manager-token"

  id-token-audience:
    description: >-
      Optional audience for manager-auth: oidc. When omitted, the Agent uses
      the Manager URL origin. Must match the Manager's configured OIDC audience.
      Invalid with manager-auth: manager-token.
    required: false
    default: ""

  manager-token:
    description: >-
      Bearer token for manager-auth: manager-token (required with manager-url).
      Cannot be combined with OIDC. Registered with `core.setSecret`
      and staged to a 0600 file under $RUNNER_TEMP; the raw value
      never crosses the agent's command line. The post step unlinks
      the staged file before exiting.
    required: false
    default: ""

  enable-html-report:
    description: >-
      Render the runtime-trace HTML report in the post step and
      upload it as the `cicd-sensor-report` artifact (single-file,
      opens inline in the Actions UI). Accepts true / false.
    required: false
    default: "true"

  enable-attestation-artifact:
    description: >-
      Generate the in-toto predicate body (predicate.json) in the
      post step and upload it as the `cicd-sensor-attestation`
      artifact. Signing the predicate is the caller's responsibility
      and runs in a downstream step or job (e.g. actions/attest@v3
      after actions/download-artifact). Accepts true / false.
    required: false
    default: "true"

  enable-debug:
    description: >-
      Upload a forensics bundle as the `cicd-sensor-debug` artifact.
      The bundle includes Runtime Event Log output when available,
      plus journalctl output, raw result-log.json, and a `systemctl show`
      snapshot. Useful for investigating tampering detections or agent
      crashes. Accepts true / false.
    required: false
    default: "false"

# Only the attestation pair is exposed as outputs (html-report and
# debug-bundle are consumed by humans through the UI). See README
# "Outputs" for cross-job forwarding semantics. README also documents
# the fixed conventions (release source, install paths, socket,
# artifact names, asset base, placement, matrix caveat).
outputs:
  attestation-artifact-id:
    description: >-
      ID of the uploaded `cicd-sensor-attestation` artifact. Empty
      string when enable-attestation-artifact is false or when upload
      failed.

  attestation-artifact-url:
    description: >-
      Run-scoped URL of the uploaded `cicd-sensor-attestation`
      artifact. Empty string when enable-attestation-artifact is false
      or when upload failed.

runs:
  using: "node24"
  pre: "dist/pre/index.js"
  main: "dist/main/index.js"
  post: "dist/post/index.js"
  post-if: "always()"
